<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM Store — Стыбаев</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Store — управление товарами</h1>

    <section class="card">
      <h2>Добавить товар</h2>
      <form id="productForm" novalidate>
        <div class="form-grid">
          <div class="field">
            <label for="name">Название</label>
            <input id="name" name="name" type="text" placeholder="Например, Наушники">
            <span class="error" id="nameError"></span>
          </div>

          <div class="field">
            <label for="price">Цена</label>
            <input id="price" name="price" type="number" step="0.01" placeholder="0">
            <span class="error" id="priceError"></span>
          </div>

          <div class="field">
            <label for="qty">Количество</label>
            <input id="qty" name="qty" type="number" step="1" placeholder="1">
            <span class="error" id="qtyError"></span>
          </div>

          <button type="submit">Добавить товар</button>
        </div>
      </form>
    </section>

    <section class="card">
      <div class="section-header">
        <h2>Товары</h2>
        <div class="total">Total: <strong id="total">0.00 ₸</strong></div>
      </div>

      <div id="productList" class="product-list"></div>
      <p id="emptyMessage" class="empty">Товаров пока нет.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
